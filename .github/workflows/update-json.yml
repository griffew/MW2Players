name: Update Player CSV

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour automatically
  workflow_dispatch: # Allows manual triggers

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Fetch complete database from Supabase and save to CSV
        env:
          SUPABASE_URL: "https://fjkzchmcjmslwrwfakcx.supabase.co"
          SUPABASE_KEY: "sb_publishable_4MnHiwh04iMIwD_qDgMPMA_QMij3f8-"
        run: |
          python -c '
          import urllib.request
          import json
          import csv
          import os

          url = os.environ["SUPABASE_URL"] + "/rest/v1/PlayerList?select=Username,GUID,IP_Address,Local_IP,Console,Mic,Status,Last_Met"
          key = os.environ["SUPABASE_KEY"]
          
          all_rows = []
          step = 1000
          start = 0

          while True:
              end = start + step - 1
              req = urllib.request.Request(url)
              req.add_header("apikey", key)
              req.add_header("Authorization", "Bearer " + key)
              req.add_header("Range", f"{start}-{end}")
              
              try:
                  with urllib.request.urlopen(req) as response:
                      data = json.loads(response.read().decode())
                      if not data:
                          break
                      all_rows.extend(data)
                      if len(data) < step:
                          break
                      start += step
              except Exception as e:
                  print(f"Error fetching range {start}-{end}: {e}")
                  break

          print(f"Total rows fetched: {len(all_rows)}")
          
          fields = ["Username", "GUID", "IP_Address", "Local_IP", "Console", "Mic", "Status", "Last_Met"]

          with open("players.csv", "w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              for row in all_rows:
                  writer.writerow(row)
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update full database players.csv via GitHub Action"
          file_pattern: players.csv
